</div>
<h3 class="text-2xl font-bold text-on-surface mb-3">Parent Mode</h3>

<div class="mt-auto flex items-center text-primary font-bold tracking-tight">
<span>Get Started</span>

</div>
<div class="absolute top-6 right-6 opacity-0 group-hover:opacity-10 transition-opacity">
<span class="material-symbols-outlined text-6xl" data-icon="security">security</span>

</button>
<button class="group relative flex flex-col text-left p-8 rounded-xl bg-surface-container-low transition-all duration-300 hover:bg-surface-container-highest active:scale-[0.98]">

</div>
<h3 class="text-2xl font-bold text-on-surface mb-3">Kids Mode</h3>
